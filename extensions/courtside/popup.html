<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>匯入場邊</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="mark">場</span><div><h1>匯入場邊</h1><p>把值得回看的內容留給社團</p></div></header>
  <form id="import-form">
    <label for="title">標題</label>
    <input id="title" maxlength="140">
    <label for="url">目前頁面網址</label>
    <input id="url" type="url" required maxlength="8192">
    <p class="hint">下一步選擇社團並確認匯入，也可設定預設社團。支援 YouTube、Bilibili、Instagram 與其他網站連結。</p>
    <button id="submit" type="submit" disabled>選擇社團並匯入 →</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
